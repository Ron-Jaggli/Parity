name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      melonloader_tag:
        description: 'MelonLoader release tag to build against'
        required: false
        default: 'v0.6.6'

env:
  MELONLOADER_TAG: ${{ github.event.inputs.melonloader_tag || 'v0.6.6' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      # Run the exact script a developer runs, rather than a CI-only copy of
      # the same commands. A copy drifts: an earlier version of this workflow
      # duplicated the DumpRefs invocation inline, so a bad flag in the script
      # sailed through CI and only broke on a real machine.
      #
      # build.sh fetches MelonLoader (Apache-2.0, published as release assets,
      # so these are the real assemblies and the mod's use of that API is
      # genuinely type-checked), builds against refs/ since the game's IL2CPP
      # assemblies are not obtainable here, and verifies the emitted assembly
      # references - which a green compile alone cannot do, and which is the one
      # thing the reference assembly approach depends on. See refs/README.md.
      - name: Build and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build.sh

      # The reference assemblies are compile-time shapes. If any of them landed
      # next to the mod they would shadow the game's real assemblies at runtime.
      - name: Check nothing but the mod is packaged
        run: |
          set -euo pipefail
          unexpected=$(find src/bin/Release -type f ! -name 'Parity.dll' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files in the build output:"
            echo "$unexpected"
            exit 1
          fi
          ls -la src/bin/Release

      - uses: actions/upload-artifact@v4
        with:
          name: Parity
          path: src/bin/Release/Parity.dll
          if-no-files-found: error
